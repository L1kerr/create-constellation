plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.150'
}

group = 'com.limer.createtree'
version = '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers { file('src/main/resources/META-INF/accesstransformer.cfg') }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'createtree'
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'createtree'
    }
}

sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory

repositories {
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force 'org.ow2.asm:asm:9.7', 'org.ow2.asm:asm-commons:9.7', 'org.ow2.asm:asm-tree:9.7', 'org.ow2.asm:asm-analysis:9.7', 'org.ow2.asm:asm-util:9.7'
    }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.233'

    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    runtimeOnly files('libs/create-1.21.1-6.0.10.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
